# Underdog Saluki 27B 1.0 (IQ2-mix) — overlay for docker-compose.yml
#
# Qwen3.8-27B (GSQ-RCO 2-bit mix, tuned to keep tool calling intact), text
# only: the mmproj vision add-on is not downloaded and --no-mmproj is set.
# 7.9 GB on disk, no MTP block in the file.
#
# 1 slot (-np 1), q8_0/q8_0 KV cache, 184320-token window.
#
# Meant to run on a 16 GB graphics card as well: 14076 MiB used after load,
# 15136 MiB peak with one 167k-token prompt (measured 2026-10-11 on the
# 24 GB RTX 5090 Laptop, not on a real 16 GB card). That leaves ~1 GiB on a
# 16 GB card, so nothing else may use its VRAM (no desktop on the same GPU).
# If it gets tight: lower -c, or use -ctv q4_0 (FA_ALL_QUANTS is compiled in).

x-download:
  repo: ConwayResearch/Underdog-Saluki-27B-1.0
  file: Underdog-Saluki-27B-1.0-IQ2-mix.gguf
  sha256: 4a673518b11b1c4445f9b9a9d3c40356f5ba39f6a6260dcb25f3fbfd475d9efb

services:
  llm:
    container_name: saluki
    command: >
      -m /models/Underdog-Saluki-27B-1.0-IQ2-mix.gguf
      -a underdog-saluki-27b,local-qwen
      --host 0.0.0.0
      --port 8080
      -ngl 99
      -np 1
      -c 184320
      -ctk q8_0
      -ctv q8_0
      --kv-unified
      --flash-attn on
      --fit on
      --fit-target 1024
      --no-mmproj
      --reasoning on
      --reasoning-effort xhigh
      --reasoning-preserve
      --temp 0.6
      --top-p 0.95
      --top-k 20
      --min-p 0.0
      --presence-penalty 0.0
      --repeat-penalty 1.0
      -lv 3
