# Huihui Qwen3.8-27B abliterated NVFP4 — overlay for docker-compose.yml
# Comparison overlay (llamacpp:native / ggml-org llama.cpp master). Default stack is unchanged.
# Stock quantized KV (-ctk/v q5_1). Mainline has no q6_0; q5_1 is the closest ~6-bit type.
#
x-download:
  repo: renketong/Huihui-Qwen3.8-27B-abliterated-NVFP4-GGUF
  file: Qwen3.8-27B-huihui-NVFP4.gguf
  sha256: 0e5970c08db16ef84c3897de2200cb038a25a4e4af49e4461cac95abbc99e631

services:
  llm:
    image: llamacpp:native
    container_name: qwen-uncensored-main
    command: >
      -m /models/Qwen3.8-27B-huihui-NVFP4.gguf
      -a qwen3.8-27b-uncensored
      --host 0.0.0.0
      --port 8080
      -ngl 99
      -np 3
      -c 262144
      -ctk q5_1
      -ctv q5_1
      --kv-unified
      --flash-attn on
      --fit on
      --fit-target 1024
      --no-mmproj
      --reasoning on
      --reasoning-effort xhigh
      --reasoning-preserve
      --temp 0.6
      --top-p 0.95
      --top-k 20
      --min-p 0.0
      --presence-penalty 0.0
      --repeat-penalty 1.0
      -lv 3
