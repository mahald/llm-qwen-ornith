# Tiel-Coder 35B-A3B Genesis Hermes NVFP4 v4 — overlay for docker-compose.yml
# Comparison overlay (llamacpp:native / ggml-org llama.cpp master). Default stack is unchanged.
# Stock quantized KV (-ctk/v q5_1). Mainline has no q6_0; q5_1 is the closest ~6-bit type.
#
x-download:
  repo: jan1k/Tiel-Coder-35B-A3B-Genesis-Hermes-NVFP4-GGUF
  file: Tiel-Coder-35B-A3B-Genesis-Hermes-NVFP4-v4.gguf
  sha256: d912f94830094b44dcbe84e2c91c32c2be45a5273ba647327c9a22cb046c0829

services:
  llm:
    image: llamacpp:native
    container_name: genesis-main
    command: >
      -m /models/Tiel-Coder-35B-A3B-Genesis-Hermes-NVFP4-v4.gguf
      -a tiel-coder-35b-genesis
      --host 0.0.0.0
      --port 8080
      -ngl 99
      -np 2
      -c 262144
      -ctk q5_1
      -ctv q5_1
      --kv-unified
      --flash-attn on
      --fit on
      --fit-target 1024
      --no-mmproj
      --reasoning on
      --reasoning-effort xhigh
      --reasoning-preserve
      --temp 0.6
      --top-p 0.95
      --top-k 20
      --min-p 0.0
      --presence-penalty 0.0
      --repeat-penalty 1.0
      -lv 3
