# Qwen3.8-27B NVFP4 HIGH — overlay for docker-compose.yml
#
# MTP is OFF. The GGUF still contains the draft head; without --spec-type it
# is never loaded. 24 GB VRAM is not enough for MTP + a useful KVarN cache.
#
# Dense 27B, ~16 GB weights. kvarn6/kvarn6 + 1024-token F16 tail. Fit keeps
# ~1 GB free (--fit-target 1024) on the RTX 5090 Laptop. 3 slots.

x-download:
  repo: esatapedico/Qwen3.8-27B-NVFP4-MTP-GGUF
  file: Qwen3.8-27B-NVFP4-MTP-HIGH.gguf
  sha256: d57008707b0558bde05ce61d7402e4e668ffd45a4c97d03d2ad97db73f98d403

services:
  llm:
    container_name: qwen
    command: >
      -m /models/Qwen3.8-27B-NVFP4-MTP-HIGH.gguf
      -a qwen3.8-27b
      --host 0.0.0.0
      --port 8080
      -ngl 99
      -np 3
      -c 262144
      -ctk kvarn6
      -ctv kvarn6
      --kv-tail-tokens 1024
      --kv-unified
      --flash-attn on
      --fit on
      --fit-target 1024
      --no-mmproj
      --reasoning on
      --reasoning-effort xhigh
      --reasoning-preserve
      --temp 0.6
      --top-p 0.95
      --top-k 20
      --min-p 0.0
      --presence-penalty 0.0
      --repeat-penalty 1.0
      -lv 3
