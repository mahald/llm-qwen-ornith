# Huihui Qwen3.8-27B abliterated NVFP4 — overlay for docker-compose.yml
#
# Uncensored sibling of qwen.yml. Same serving shape: MTP OFF, no mmproj.
# The GGUF still contains the draft head; without --spec-type it is never
# loaded. 19.65 GB weights — tighter than HIGH, still aims at 24 GB with
# --fit-target 1024. 3 slots. kvarn6/kvarn6 + 1024-token F16 tail.

x-download:
  repo: renketong/Huihui-Qwen3.8-27B-abliterated-NVFP4-GGUF
  file: Qwen3.8-27B-huihui-NVFP4.gguf
  sha256: 0e5970c08db16ef84c3897de2200cb038a25a4e4af49e4461cac95abbc99e631

services:
  llm:
    container_name: qwen-uncensored
    command: >
      -m /models/Qwen3.8-27B-huihui-NVFP4.gguf
      -a qwen3.8-27b-uncensored
      --host 0.0.0.0
      --port 8080
      -ngl 99
      -np 3
      -c 262144
      -ctk kvarn6
      -ctv kvarn6
      --kv-tail-tokens 1024
      --kv-unified
      --flash-attn on
      --fit on
      --fit-target 1024
      --no-mmproj
      --reasoning on
      --reasoning-effort xhigh
      --reasoning-preserve
      --temp 0.6
      --top-p 0.95
      --top-k 20
      --min-p 0.0
      --presence-penalty 0.0
      --repeat-penalty 1.0
      -lv 3
