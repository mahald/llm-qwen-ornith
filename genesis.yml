# Tiel-Coder 35B-A3B Genesis Hermes NVFP4 v4 — overlay for docker-compose.yml
#
# Non-MTP GGUF (733 tensors, no nextn / blk.40). NVFP4 v4 with inline
# scales. Same serving shape as tiel.yml: 2 slots, --no-mmproj,
# kvarn6/kvarn6 + 1024-token F16 tail. 21.475 GB on 24 GB; --fit-target 1024.
#
# Genesis-calibrated Tiel-Coder with Hermes tool-calling transfer
# (jan1k / LuffyTheFox). MTP sibling is a separate file we do not download.

x-download:
  repo: jan1k/Tiel-Coder-35B-A3B-Genesis-Hermes-NVFP4-GGUF
  file: Tiel-Coder-35B-A3B-Genesis-Hermes-NVFP4-v4.gguf
  sha256: d912f94830094b44dcbe84e2c91c32c2be45a5273ba647327c9a22cb046c0829

services:
  llm:
    container_name: genesis
    command: >
      -m /models/Tiel-Coder-35B-A3B-Genesis-Hermes-NVFP4-v4.gguf
      -a tiel-coder-35b-genesis
      --host 0.0.0.0
      --port 8080
      -ngl 99
      -np 2
      -c 262144
      -ctk kvarn6
      -ctv kvarn6
      --kv-tail-tokens 1024
      --kv-unified
      --flash-attn on
      --fit on
      --fit-target 1024
      --no-mmproj
      --reasoning on
      --reasoning-effort xhigh
      --reasoning-preserve
      --temp 0.6
      --top-p 0.95
      --top-k 20
      --min-p 0.0
      --presence-penalty 0.0
      --repeat-penalty 1.0
      -lv 3
