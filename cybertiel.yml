# Cyber-Tiel-Coder 35B-A3B UD-Q4_K_XL — overlay for docker-compose.yml
#
# MTP is OFF. The GGUF still contains the grafted draft head; without
# --spec-type it is never loaded. 22.7 GB weights on 24 GB — tighter
# than Ornith; --fit-target 1024 shrinks context to keep ~1 GB free.
#
# Abliterated Ornith-1.5 MoE ~3B active. Same serving shape as tiel.yml:
# 2 slots, --no-mmproj, kvarn6/kvarn6 + 1024-token F16 tail.

x-download:
  repo: peculiar-ragdoll/Cyber-Tiel-Coder-35B-A3B-GGUF-MTP
  file: Cyber-Tiel-Coder-35B-A3B-MTP-UD-Q4_K_XL.gguf
  sha256: 0bbcf3cc9be4c976bad20e641baf629dad9c178d39ebdc9cd72129179943c06a

services:
  llm:
    container_name: cybertiel
    command: >
      -m /models/Cyber-Tiel-Coder-35B-A3B-MTP-UD-Q4_K_XL.gguf
      -a cyber-tiel-coder-35b
      --host 0.0.0.0
      --port 8080
      -ngl 99
      -np 2
      -c 262144
      -ctk kvarn6
      -ctv kvarn6
      --kv-tail-tokens 1024
      --kv-unified
      --flash-attn on
      --fit on
      --fit-target 1024
      --no-mmproj
      --reasoning on
      --reasoning-effort xhigh
      --reasoning-preserve
      --temp 0.6
      --top-p 0.95
      --top-k 20
      --min-p 0.0
      --presence-penalty 0.0
      --repeat-penalty 1.0
      -lv 3
