# Cyber-Tiel-Coder 35B-A3B UD-Q4_K_XL — overlay for docker-compose.yml
#
# MTP is OFF. The GGUF still contains grafted blk.40 (Q3_K, 371 MiB);
# without --spec-type llama-server ignores that whole block. 22.75 GB on
# disk / 22.36 GB loaded on 24 GB — tighter than HIGH; --fit-target 1024
# shrinks context to keep ~1 GB free.
#
# Abliterated Ornith-1.5 MoE ~3B active. Same serving shape as qwen.yml:
# 1 slot (-np 1), --no-mmproj, q8_0/q8_0 KV cache, 184320-token window.

x-download:
  repo: peculiar-ragdoll/Cyber-Tiel-Coder-35B-A3B-GGUF-MTP
  file: Cyber-Tiel-Coder-35B-A3B-MTP-UD-Q4_K_XL.gguf
  sha256: 0bbcf3cc9be4c976bad20e641baf629dad9c178d39ebdc9cd72129179943c06a

services:
  llm:
    container_name: cybertiel
    command: >
      -m /models/Cyber-Tiel-Coder-35B-A3B-MTP-UD-Q4_K_XL.gguf
      -a cyber-tiel-coder-35b,local-qwen
      --host 0.0.0.0
      --port 8080
      -ngl 99
      -np 1
      -c 184320
      -ctk q8_0
      -ctv q8_0
      --kv-unified
      --flash-attn on
      --fit on
      --fit-target 1024
      --no-mmproj
      --reasoning on
      --reasoning-effort xhigh
      --reasoning-preserve
      --temp 0.6
      --top-p 0.95
      --top-k 20
      --min-p 0.0
      --presence-penalty 0.0
      --repeat-penalty 1.0
      -lv 3
