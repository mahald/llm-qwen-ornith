# Ornith-1.5 35B-A3B NVFP4 Q5K — overlay for docker-compose.yml
#
# MTP is OFF. The GGUF still contains the draft head; without --spec-type it
# is never loaded (blk.40.nextn.* stay unused). 24 GB is tight for this
# 20 GB trunk; MTP would steal the KV budget.
#
# MoE ~3B active. Fit keeps the whole trunk on GPU (stock placement).
# 2 slots. --fit-target 1024 ≈ 1 GB VRAM headroom.

x-download:
  repo: Avifenesh/Ornith-1.5-35B-A3B-NVFP4-MTP-GGUF
  file: Ornith-1.5-35B-A3B-NVFP4-Q5K-mtp.gguf
  sha256: 72ff9600aa2b0de77a5b27041a84448c2ce88c7b2055529fc23b3cd5bf518fd3

services:
  llm:
    container_name: ornith
    command: >
      -m /models/Ornith-1.5-35B-A3B-NVFP4-Q5K-mtp.gguf
      -a ornith-1.5-35b
      --host 0.0.0.0
      --port 8080
      -ngl 99
      -np 2
      -c 262144
      -ct vbr
      --kv-unified
      --vbr-vram auto
      --fit on
      --fit-target 1024
      --no-mmproj
      --temp 0.6
      --top-p 0.95
      --top-k 20
      --min-p 0.0
      --presence-penalty 0.0
      --repeat-penalty 1.0
      -lv 3

