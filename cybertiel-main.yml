# Cyber-Tiel-Coder 35B-A3B UD-Q4_K_XL — overlay for docker-compose.yml
# Comparison overlay (llamacpp:native / ggml-org llama.cpp master). Default stack is unchanged.
# Stock quantized KV (-ctk/v q5_1). Mainline has no q6_0; q5_1 is the closest ~6-bit type.
#
x-download:
  repo: peculiar-ragdoll/Cyber-Tiel-Coder-35B-A3B-GGUF-MTP
  file: Cyber-Tiel-Coder-35B-A3B-MTP-UD-Q4_K_XL.gguf
  sha256: 0bbcf3cc9be4c976bad20e641baf629dad9c178d39ebdc9cd72129179943c06a

services:
  llm:
    image: llamacpp:native
    container_name: cybertiel-main
    command: >
      -m /models/Cyber-Tiel-Coder-35B-A3B-MTP-UD-Q4_K_XL.gguf
      -a cyber-tiel-coder-35b
      --host 0.0.0.0
      --port 8080
      -ngl 99
      -np 2
      -c 262144
      -ctk q5_1
      -ctv q5_1
      --kv-unified
      --flash-attn on
      --fit on
      --fit-target 1024
      --no-mmproj
      --reasoning on
      --reasoning-effort xhigh
      --reasoning-preserve
      --temp 0.6
      --top-p 0.95
      --top-k 20
      --min-p 0.0
      --presence-penalty 0.0
      --repeat-penalty 1.0
      -lv 3
